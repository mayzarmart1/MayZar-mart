<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MayZar Mart Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo-area">
      <h1>Admin Panel</h1>
    </div>
    <nav>
      <a href="index.html">Back to Store</a>
    </nav>
  </header>

  <section class="section">
    <h3>➕ Add New Product</h3>

    <div class="checkout-box">
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price (Ksh)">
      
      <select id="pCategory">
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Home">Home</option>
      </select>

      <input type="text" id="pImage" placeholder="Image Link (URL)">
      <input type="text" id="pDesc" placeholder="Product Description">

      <button class="btn" onclick="addProduct()">Add Product</button>
      <button class="clear-btn" onclick="clearProducts()">Clear All Products</button>
    </div>
  </section>

  <section class="section">
    <h3>📦 Current Products</h3>
    <div class="cart-box">
      <ul id="productList"></ul>
    </div>
  </section>

  <script>
    let products = JSON.parse(localStorage.getItem("products")) || [];

    function showProducts() {
      let list = document.getElementById("productList");
      list.innerHTML = "";

      products.forEach((p, index) => {
        list.innerHTML += `
          <li style="padding:10px; background:#f4f4f4; margin-bottom:8px; border-radius:10px;">
            <b>${p.name}</b> - Ksh ${p.price} (${p.category})
            <button style="float:right; background:red; color:white; border:none; padding:5px 10px; border-radius:8px; cursor:pointer;"
              onclick="deleteProduct(${index})">Delete</button>
          </li>
        `;
      });
    }

    function addProduct() {
      let name = document.getElementById("pName").value;
      let price = document.getElementById("pPrice").value;
      let category = document.getElementById("pCategory").value;
      let img = document.getElementById("pImage").value;
      let desc = document.getElementById("pDesc").value;

      if (!name || !price || !img || !desc) {
        alert("Fill all fields!");
        return;
      }

      let newProduct = {
        id: Date.now(),
        name: name,
        price: parseInt(price),
        category: category,
        img: img,
        desc: desc
      };

      products.push(newProduct);
      localStorage.setItem("products", JSON.stringify(products));

      alert("Product added successfully!");
      showProducts();
    }

    function deleteProduct(index) {
      products.splice(index, 1);
      localStorage.setItem("products", JSON.stringify(products));
      showProducts();
    }

    function clearProducts() {
      if (confirm("Are you sure you want to delete ALL products?")) {
        products = [];
        localStorage.setItem("products", JSON.stringify(products));
        showProducts();
      }
    }

    showProducts();
  </script>

</body>
</html>
